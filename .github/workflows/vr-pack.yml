# Counterpart to powerof3's pack-skse-mod pipeline: the fork's entry for building and
# releasing the VR plugin binaries. Called by main.yml's owner-gated `vr` job.
#
# - build runs on every trigger (CI).
# - On a version tag vX.Y.Z.W (upstream X.Y.Z + the VR patch from VR_VERSION, the
#   same scheme AE uses), it also verifies the tag matches CMakeLists, packages the
#   dll+pdb only (no Data/Papyrus assets — the VR download is an overwrite on top of
#   the SE download, which already ships the identical compiled Papyrus scripts),
#   publishes the GitHub Release, and runs the Nexus upload (dry-run unless
#   NEXUS_AUTO_UPLOAD=true).
#
# Why this isn't pack-skse-mod: that workflow checks out with submodules:false, so it
# can't build against our extern/CommonLibVR submodule, and its publish path is
# powerof3's Nexus pipeline rather than alandtse/nexus-workflows.
name: "VR pack"

on:
  workflow_call:
    secrets:
      UNEX_NEXUSMODS_SESSION_COOKIE:
        required: false
      UNEX_APIKEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (CMake · vs2026 · Release)
    # The vs2026-windows-vcpkg-vr preset needs the VS2026 generator; windows-2025 is the
    # first hosted image to ship it.
    runs-on: windows-2025
    outputs:
      artifact-name: papyrus-extender-vr-binaries
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract vcpkg baseline
        id: vcpkg_baseline
        shell: pwsh
        run: |
          $vcpkgJson = Get-Content vcpkg.json | ConvertFrom-Json
          $baseline = $vcpkgJson.'builtin-baseline'
          echo "baseline=$baseline" >> $env:GITHUB_OUTPUT

      - uses: lukka/get-cmake@latest

      - name: Restore vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/b/vcpkg"
          vcpkgGitCommitId: "${{ steps.vcpkg_baseline.outputs.baseline }}"
          vcpkgJsonGlob: "vcpkg.json"

      # x-gha reads the Actions cache endpoint from these two variables, which GitHub
      # only exposes to the github-script runtime — re-export them so vcpkg sees them.
      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: "${{ github.workspace }}/CMakeLists.txt"
          configurePreset: vs2026-windows-vcpkg-vr
          buildPreset: vs2026-windows-vcpkg-vr

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item buildvr/Release/po3_PapyrusExtender.dll staging/
          Copy-Item buildvr/Release/po3_PapyrusExtender.pdb staging/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: papyrus-extender-vr-binaries
          path: staging/*
          if-no-files-found: error

  verify:
    name: Verify tag matches CMake version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      nexus_version: ${{ steps.v.outputs.nexus_version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          base=$(grep -oP 'set\(VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          vr=$(grep -oP 'set\(VR_VERSION \K[0-9]+' CMakeLists.txt | head -1)
          expected="${base}.${vr}"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag '$tag' (version $version) != CMake version $expected (VERSION.VR_VERSION). Bump VR_VERSION/VERSION or fix the tag." >&2
            exit 1
          fi
          # Nexus shows the 3-part upstream version for the base build; the trailing VR
          # `.0` is dropped so the VR mod page matches the SE/AE mod page exactly when no
          # VR-only fix was needed. A VR-only patch (.1+) keeps all four parts, which is
          # itself the signal that this VR build differs from the numbered SE/AE release.
          nexus_version="${version%.0}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "nexus_version=$nexus_version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package & publish
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the archive
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: bin

      - name: Assemble archive
        id: pkg
        run: |
          set -euo pipefail
          ver="${{ needs.verify.outputs.nexus_version }}"
          # Hyphenated archive name (no spaces) for safe handling downstream; the Nexus
          # display name is set separately via mod_filename.
          stage="Papyrus-Extender-VR-${ver}"
          mkdir -p "$stage/SKSE/Plugins"
          cp bin/po3_PapyrusExtender.dll bin/po3_PapyrusExtender.pdb "$stage/SKSE/Plugins/"
          sudo apt-get update && sudo apt-get install -y p7zip-full
          7z a -t7z -mx=9 "${stage}.7z" "$stage"
          echo "archive=${stage}.7z" >> "$GITHUB_OUTPUT"
          7z l "${stage}.7z"

      - name: Create release and attach archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber

  nexus:
    name: Nexus upload
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/nexus-upload.yaml
    with:
      tag: ${{ needs.verify.outputs.tag }}
      mod_version: ${{ needs.verify.outputs.nexus_version }}
      dry_run: ${{ vars.NEXUS_AUTO_UPLOAD == 'true' && 'false' || 'true' }}
    secrets:
      UNEX_NEXUSMODS_SESSION_COOKIE: ${{ secrets.UNEX_NEXUSMODS_SESSION_COOKIE }}
      UNEX_APIKEY: ${{ secrets.UNEX_APIKEY }}
